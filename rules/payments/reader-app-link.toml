id = "payments.reader-app-link"
title = "Reader app links to account sign-up without the External Link Account entitlement"
severity = "error"
evidence = ["source", "entitlements", "plist", "human"]
enforced_by = "app-review"
guidelines = ["3.1", "3.1.3"]
summary = """
Reader apps, which give access to previously bought magazines, newspapers, books, audio, music, or video, may skip in-app purchase. Outside the United States storefront, a link to the developer's website to create or manage an account needs the External Link Account Entitlement, `com.apple.developer.storekit.external-link.account`, with the `SKExternalLinkAccount` Info.plist key, opened through `ExternalLinkAccount.open()` so the system disclosure sheet appears first.
"""
fix = """
Request the External Link Account Entitlement, add the entitlement and `SKExternalLinkAccount`, check `ExternalLinkAccount.canOpen`, and open the link only with `ExternalLinkAccount.open()`. Without the entitlement, remove the link on every storefront except the US.
"""
references = [
  "https://developer.apple.com/app-store/review/guidelines/#3.1.3",
  "https://developer.apple.com/support/reader-apps/",
  "https://developer.apple.com/documentation/storekit/externallinkaccount",
]

[check]
id = "external-purchase-config"
confidence = "medium"
catalog = "payments-external-purchase"

[review]
questions = [
  "Is the app's main purpose access to previously purchased reading, listening, or viewing content?",
  "Does any link to create or manage an account appear on a non-US storefront, and is it opened through `ExternalLinkAccount`?",
]
