id = "payments.legacy-receipt-validation"
title = "On-device receipt validation that may reject current receipts"
severity = "warning"
evidence = ["source"]
enforced_by = "app-review"
guidelines = ["2.1"]
applies_when = ["in-app-purchase"]
since = "2025-01-24"
summary = """
App Store receipts are signed with a SHA-256 intermediate certificate since January 24, 2025. Hand-rolled on-device receipt validation that pins the old certificate or algorithm treats valid purchases as invalid, so the reviewer cannot unlock paid content.
"""
fix = """
Verify purchases with StoreKit 2 `Transaction` and `AppTransaction`, which handle signing for you. If you must validate receipts yourself, support SHA-256.
"""
references = [
  "https://developer.apple.com/news/upcoming-requirements/?id=01242025a",
  "https://developer.apple.com/documentation/storekit/apptransaction",
]

[check]
id = "receipt-validation"
confidence = "low"
signals = ["appStoreReceiptURL", "PKCS7", "AppleIncRootCertificate", "SKReceiptRefreshRequest"]
