id = "business.creator-tips"
title = "Tips or monetary gifts tied to digital content skip in-app purchase"
severity = "warning"
evidence = ["source", "human"]
enforced_by = "app-review"
guidelines = ["3.1.1", "3.2.1"]
summary = """
Apps may use in-app purchase currencies to tip the developer or digital content providers. An individual may give a monetary gift to another individual without in-app purchase only if the gift is entirely optional and 100% of the funds reach the receiver. A gift connected at any point to receiving digital content or services must use in-app purchase.
"""
fix = """
Route tips that unlock or relate to digital content, such as paid messages, exclusive posts, or stream perks, through in-app purchase. Use outside payment only for optional person-to-person gifts that pass the full amount to the receiver and unlock nothing.
"""
references = [
  "https://developer.apple.com/app-store/review/guidelines/#3.1.1",
  "https://developer.apple.com/app-store/review/guidelines/#3.2.1",
]

[check]
id = "creator-tips"
confidence = "low"
signals = ["sendTip", "tipJar", "TipJar", "tipCreator", "tip the creator", "superChat", "sendGift", "donateToCreator"]

[review]
questions = [
  "Does a tip or gift ever unlock, accompany, or relate to digital content or services?",
  "For gifts paid outside in-app purchase, are they optional and does the receiver get 100% of the funds?",
]
