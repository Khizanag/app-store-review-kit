id = "account.siwa-private-email"
title = "Sign in with Apple undermined by re-asking for email or rejecting relay addresses"
severity = "warning"
evidence = ["source", "runtime", "human"]
enforced_by = "app-review"
guidelines = ["4.8"]
applies_when = ["accounts"]
summary = """
Guideline 4.8 values a login that lets people keep their email private. Asking for a personal email or name again after Sign in with Apple, or refusing a private relay address, defeats that choice, and Apple's design guidance says not to override it. Apple announced in August 2026 that new relay addresses will be issued on `private.icloud.com` later in 2026; validation or allowlists that accept only `privaterelay.appleid.com` will reject those users.
"""
fix = """
Use the name and email from the Sign in with Apple credential, ask for nothing else the app does not need, and accept relay addresses on both `private.icloud.com` and `privaterelay.appleid.com`. Register your outbound email domains for the private relay service.
"""
references = [
  "https://developer.apple.com/news/?id=1ptvdtcm",
  "https://developer.apple.com/design/human-interface-guidelines/sign-in-with-apple",
  "https://developer.apple.com/documentation/signinwithapple/communicating-using-the-private-email-relay-service",
]

[check]
id = "siwa-relay-domain"
confidence = "medium"
legacy_domain = "privaterelay.appleid.com"
required_domain = "private.icloud.com"
siwa_signals = ["ASAuthorizationAppleIDProvider", "SignInWithAppleButton"]

[review]
questions = [
  "After Sign in with Apple, does the app ask for an email address or name it already received?",
  "Does sign-up and email validation accept a relay address on `private.icloud.com`?",
]
