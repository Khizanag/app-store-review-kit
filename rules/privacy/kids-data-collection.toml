id = "privacy.kids-data-collection"
title = "Kids app collects or shares personal data or device identifiers"
severity = "error"
evidence = ["source", "binary", "plist", "human"]
enforced_by = "app-review"
guidelines = ["5.1.4", "1.3"]
applies_when = ["kids"]
summary = """
Apps for kids may ask for birthdate and parental contact only to comply with children's privacy laws such as COPPA and GDPR, must stay useful whatever age is entered, and should not include third-party analytics or advertising. Apple's Kids Category guidance adds that kids apps should not send personally identifiable or device information to third parties, even from sections meant for adults, unless a parent explicitly consents. Any app that collects personal information from a minor, such as name, email, location, photos, chat, or persistent identifiers combined with them, needs a privacy policy and must comply with children's privacy statutes.
"""
fix = """
Collect nothing beyond what the feature needs and what the law permits. Drop advertising identifiers and third-party analytics and ad SDKs, or replace them with services that meet guideline 1.3. Get verifiable parental consent before collecting a child's personal data, and link a privacy policy that covers it.
"""
references = [
  "https://developer.apple.com/app-store/review/guidelines/#5.1.4",
  "https://developer.apple.com/app-store/kids-apps/",
]

[check]
id = "kids-data-signals"
confidence = "medium"
catalog = "tracking-sdks"
signals = ["ASIdentifierManager", "advertisingIdentifier", "ATTrackingManager", "NSUserTrackingUsageDescription", "CLLocationManager", "CNContactStore", "PHPhotoLibrary.requestAuthorization"]

[review]
questions = [
  "Does the app ask a child for anything beyond a birthdate or a parent's contact, and only to comply with the law?",
  "Does the app stay useful for every age entered, rather than turning young users away?",
  "Is verifiable parental consent collected before any personal data, chat, photos, or location of a child is stored or shared?",
]
