id = "privacy.social-network-credentials"
title = "Social network login required, irrevocable, or its tokens stored off-device"
severity = "warning"
evidence = ["source", "human"]
enforced_by = "app-review"
guidelines = ["5.1.1"]
applies_when = ["accounts"]
summary = """
Guideline 5.1.1(v): unless the core function is tied to a specific social network, the app must work without that network's login; pulling a profile, sharing, or inviting friends is not core functionality. The app must let people revoke the social network credentials and stop data exchange from inside the app, and may not store those credentials or tokens off the device or use them except to connect to the network directly from the app while it is in use.
"""
fix = """
Offer use without the social login, or another sign-in method. Add a Disconnect control that signs out of the network's SDK and deletes its tokens. Keep tokens in the device keychain, never on your server, and call the network's API only from the app in the foreground.
"""
references = [
  "https://developer.apple.com/app-store/review/guidelines/#5.1.1",
]

[check]
id = "social-login-controls"
confidence = "low"
sdks = ["FBSDKLoginKit", "GoogleSignIn", "TwitterKit", "LineSDK", "KakaoSDKAuth", "WechatOpenSDK", "react-native-fbsdk-next", "@react-native-google-signin/google-signin"]
revoke_signals = ["logOut()", "signOut()", "disconnect(", "revokeAccess", "unlink("]
token_upload_signals = ["accessToken.tokenString", "idToken.tokenString", "AccessToken.current"]

[review]
questions = [
  "Can a person use the app's core features without the social network's login?",
  "Is there an in-app control that disconnects the social network and deletes its tokens?",
  "Are social network tokens kept only on the device, never sent to or stored on the developer's server?",
]
