# Patterns adapted from CharlesWiltgen/Axiom (MIT).
id = "security.secrets-in-logs"
title = "Passwords or tokens written to logs"
severity = "warning"
evidence = ["source"]
enforced_by = "app-review"
guidelines = ["1.6"]
summary = """
Logging a password, token, or API key puts it in the device log, crash reports, and any analytics breadcrumbs. `NSLog`, `print`, and `os_log` or `Logger` interpolations marked `.public` are readable by anyone with the device and a Mac. `Logger` redacts dynamic strings by default, so a `.private` or `.sensitive` interpolation is fine.
"""
fix = """
Remove the value from the message, or log it through `Logger` with `privacy: .private` or a `.hash` mask when correlation is needed.
"""
references = [
  "https://developer.apple.com/documentation/os/generating-log-messages-from-your-code",
]

[check]
id = "source-patterns"
confidence = "medium"
code_only = true
patterns = [
  '(?i)\b(print|debugPrint|NSLog|os_log|console\.(log|debug|info|warn|error))\s*\([^\n]*\b(password|passwd|token|api_?key|secret|bearer|authorization)\b',
  '(?i)\blogger\.\w+\([^\n]*\b(password|passwd|token|api_?key|secret|bearer|authorization)\b[^\n]*privacy:\s*\.public',
]
ignore = ['privacy:\s*\.(private|sensitive)', '%\{private\}', '%\{sensitive\}']
