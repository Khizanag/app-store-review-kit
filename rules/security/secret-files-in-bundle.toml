# File list adapted from aprilNH7/expo-preflight (MIT).
id = "security.secret-files-in-bundle"
title = "Signing keys or service credentials copied into the app bundle"
severity = "error"
evidence = ["binary", "project"]
enforced_by = "app-review"
guidelines = ["1.6"]
summary = """
App Store Connect API keys (`.p8`), certificate bundles (`.p12`), PEM private keys, Android keystores, service-account JSON files, and `.env` files sometimes land in Copy Bundle Resources or a synchronized folder. Anyone who unzips the IPA gets them. `embedded.mobileprovision` and `GoogleService-Info.plist` are expected in the bundle and are not flagged.
"""
fix = """
Remove the file from every target's membership and from the repository, then revoke and reissue the credential. Keep signing material in the keychain or CI secrets.
"""

[check]
id = "bundle-files"
confidence = "high"
extensions = [".p8", ".p12", ".pfx", ".keystore", ".jks"]
names = [".env", ".env.production", "service-account.json", "google-service-account.json"]
content_patterns = ['-----BEGIN ([A-Z]+ )?PRIVATE KEY-----']
allow = ["embedded.mobileprovision", "GoogleService-Info.plist"]
