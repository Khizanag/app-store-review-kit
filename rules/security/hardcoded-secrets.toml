# Patterns adapted from RevylAI/greenlight and CharlesWiltgen/Axiom (both MIT).
id = "security.hardcoded-secrets"
title = "Server secrets or private keys compiled into the app"
severity = "warning"
evidence = ["source", "binary"]
enforced_by = "app-review"
guidelines = ["1.6"]
summary = """
Anything in the app bundle can be extracted with `strings` on the binary. A cloud access key, a payment secret key, a source-control token, or a private key in the app lets anyone act as the developer's server, which breaks 1.6's requirement to prevent unauthorized access to user data. Publishable client keys, such as a Stripe `pk_live_` key or a Firebase API key, are meant to ship and are not flagged.
"""
fix = """
Revoke and rotate the exposed secret first; removing it from the next build does not undo the leak. Move the call that needs it to your server, and give the app a short-lived, per-user token instead.
"""
references = [
  "https://developer.apple.com/documentation/security/keychain-services",
]

[check]
id = "secret-patterns"
confidence = "medium"
skip_paths = ["Tests/", "UITests/", "Fixtures/", "Preview Content/"]
patterns = [
  '\bAKIA[0-9A-Z]{16}\b',
  '\bgh[pousr]_[A-Za-z0-9]{36}\b',
  '\b(sk|rk)_live_[0-9A-Za-z]{20,}',
  '\bsk-(proj-|ant-)?[A-Za-z0-9_-]{24,}',
  '\bxox[abprs]-[0-9A-Za-z-]{10,}',
  '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----',
  '''(?i)\b(api[_-]?secret|secret[_-]?key|client[_-]?secret|private[_-]?key)\s*[:=]\s*["'][A-Za-z0-9+/_=-]{20,}["']''',
]
