id = "design.web-wrapper"
title = "App is mostly a wrapped website"
severity = "warning"
evidence = ["source", "human"]
enforced_by = "app-review"
guidelines = ["4.2", "4.2.2"]
applies_when = ["web-content"]
summary = """
Apps must offer features, content, and UI beyond a repackaged website. An app whose main screen is a `WKWebView` loading the developer's site, with little native functionality, is rejected for minimum functionality.
"""
fix = """
Build the core flows natively and use platform capabilities the website cannot, such as offline use, widgets, notifications, or system integrations.
"""

[check]
id = "web-wrapper"
confidence = "low"
signals = ["WKWebView", "WebView(", "SFSafariViewController", "WebPage("]

[review]
questions = [
  "Is there meaningful native functionality beyond the web content?",
  "Is the app mainly marketing material, ads, web clippings, a content aggregator, or a collection of links?",
  "Is the app only a song, a movie, a book, or a game guide that belongs in the iTunes Store or Apple Books?",
]
