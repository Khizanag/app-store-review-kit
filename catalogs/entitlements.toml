[[entitlements]]
key = "com.apple.developer.sensorkit.reader.allow"
capability = "SensorKit"
signals = ["SRSensorReader"]
guidelines = ["5.1.3"]
approval = true
note = "Granted only for studies Apple approves."

[[entitlements]]
key = "com.apple.developer.automatic-assessment-configuration"
capability = "Automatic Assessment Configuration"
signals = ["AEAssessmentSession"]
guidelines = ["2.5.1"]
approval = true

[[entitlements]]
key = "com.apple.developer.financekit"
