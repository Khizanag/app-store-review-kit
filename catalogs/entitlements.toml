# Entitlements App Review looks at: what each one needs in the app, the guideline it falls under,
# and whether Apple must approve it before an App Store build can carry it.
# `signals` are code symbols that show the capability is in use; an entitlement with none of them
# is a candidate for capabilities.entitlement-unused. An empty list means the engine cannot tell.
# `approval = true` only where Apple's page for the entitlement says to request it.
# Key selection informed by Kofiloski/app-store-review-risk and setlog-app/expo-plist-audit (both MIT).

source = "https://developer.apple.com/documentation/bundleresources/entitlements"
requests = "https://developer.apple.com/help/account/capabilities/capability-requests/"
verified = 2026-10-01

[[entitlements]]
key = "aps-environment"
capability = "Push Notifications"
signals = ["registerForRemoteNotifications", "didRegisterForRemoteNotificationsWithDeviceToken", "PKPushRegistry"]
guidelines = ["4.5.4"]
approval = false
note = "Expo and several SDKs add it automatically. Remove it when the app only schedules local notifications."

[[entitlements]]
key = "com.apple.developer.aps-environment"
capability = "Push Notifications (macOS)"
signals = ["registerForRemoteNotifications", "didRegisterForRemoteNotificationsWithDeviceToken"]
guidelines = ["4.5.4"]
approval = false

[[entitlements]]
key = "com.apple.developer.usernotifications.critical-alerts"
capability = "Critical Alerts"
signals = [".criticalAlert", "defaultCritical", "criticalSoundNamed"]
guidelines = ["4.5.4"]
approval = true
request = "https://developer.apple.com/contact/request/notifications-critical-alerts-entitlement/"

[[entitlements]]
key = "com.apple.developer.usernotifications.filtering"
capability = "Notification filtering"
signals = ["UNNotificationServiceExtension"]
guidelines = ["4.5.4"]
approval = true

[[entitlements]]
key = "com.apple.developer.healthkit"
capability = "HealthKit"
signals = ["HKHealthStore"]
guidelines = ["2.5.1", "5.1.3"]
approval = false
note = "HealthKit must serve health and fitness and integrate with the Health app. Needs NSHealthShareUsageDescription or NSHealthUpdateUsageDescription."

[[entitlements]]
key = "com.apple.developer.healthkit.access"
capability = "HealthKit clinical records"
signals = ["HKClinicalType", "clinicalType(forIdentifier:"]
guidelines = ["5.1.3"]
approval = false
note = "Value health-records. Add only the data types the app reads; App Review may reject unused ones."

[[entitlements]]
key = "com.apple.developer.healthkit.background-delivery"
capability = "HealthKit background delivery"
signals = ["enableBackgroundDelivery"]
guidelines = ["2.5.4"]
approval = false

[[entitlements]]
key = "com.apple.developer.icloud-services"
capability = "iCloud"
signals = ["CKContainer", "CKDatabase", "CKSyncEngine", "cloudKitDatabase", "NSPersistentCloudKitContainer", "url(forUbiquityContainerIdentifier:", "NSUbiquitousKeyValueStore"]
guidelines = ["2.5.1"]
approval = false
note = "Values CloudDocuments, CloudKit, CloudKit-Anonymous. Health data may not be stored in iCloud (5.1.3); the privacy rules cover that side."

[[entitlements]]
key = "com.apple.developer.icloud-container-identifiers"
capability = "iCloud containers"
signals = ["CKContainer", "cloudKitDatabase", "NSPersistentCloudKitContainer", "url(forUbiquityContainerIdentifier:"]
guidelines = ["2.5.1"]
approval = false

[[entitlements]]
key = "com.apple.developer.ubiquity-kvstore-identifier"
capability = "iCloud key-value storage"
signals = ["NSUbiquitousKeyValueStore"]
guidelines = ["2.5.1"]
approval = false

[[entitlements]]
key = "com.apple.developer.homekit"
capability = "HomeKit"
signals = ["HMHomeManager"]
guidelines = ["2.5.1"]
approval = false
note = "HomeKit must provide home automation, and the description must say so."

[[entitlements]]
key = "com.apple.developer.matter.allow-setup-payload"
capability = "Matter setup payload"
signals = ["MatterAddDeviceRequest"]
guidelines = ["2.5.17"]
approval = false

[[entitlements]]
key = "com.apple.developer.siri"
capability = "Siri"
signals = ["INExtension", "INInteraction", "INPreferences.requestSiriAuthorization", "IntentsSupported"]
guidelines = ["2.5.11"]
approval = false
note = "App Intents and App Shortcuts need no entitlement; this one is for SiriKit intents."

[[entitlements]]
key = "com.apple.developer.networking.vpn.api"
capability = "Personal VPN"
signals = ["NEVPNManager"]
guidelines = ["5.4"]
approval = false
note = "Guideline 5.4 limits VPN apps to organization accounts and requires a data-use declaration before purchase or use."

[[entitlements]]
key = "com.apple.developer.networking.networkextension"
capability = "Network Extensions"
signals = ["NETunnelProviderManager", "NEPacketTunnelProvider", "NEAppProxyProvider", "NEFilterDataProvider", "NEFilterManager", "NEDNSProxyProvider", "NEDNSSettingsManager", "NEAppPushProvider", "NERelayManager", "NEURLFilterManager"]
guidelines = ["5.4"]
approval = false
note = "Tunnel, proxy, and filter providers fall under 5.4: organization account, data-use declaration, no data sale."

[[entitlements]]
key = "com.apple.developer.networking.multicast"
capability = "Multicast networking"
signals = ["NWConnectionGroup", "NWMulticastGroup", "IP_ADD_MEMBERSHIP"]
guidelines = ["2.5.1"]
approval = true

[[entitlements]]
key = "com.apple.developer.networking.HotspotHelper"
capability = "Hotspot Helper"
signals = ["NEHotspotHelper"]
guidelines = ["2.5.1"]
approval = true

[[entitlements]]
key = "com.apple.developer.networking.HotspotConfiguration"
capability = "Hotspot Configuration"
signals = ["NEHotspotConfigurationManager"]
guidelines = ["2.5.1"]
approval = false

[[entitlements]]
key = "com.apple.developer.networking.wifi-info"
capability = "Access Wi-Fi Information"
signals = ["CNCopyCurrentNetworkInfo", "fetchCurrent"]
