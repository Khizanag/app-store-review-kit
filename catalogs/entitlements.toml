[[entitlements]]
key = "com.apple.developer.web-browser"
capability = "Default web browser"
signals = ["WKWebView", "WebPage("]
guidelines = ["2.5.6"]
approval = true
request = "https://developer.apple.com/documentation/xcode/preparing-your-app-to-be-the-default-browser"
note = "The app must open http and https URLs directly, offer a URL field, search, or bookmarks at launch, avoid UIWebView, and skip the purpose strings the page bans."

[[entitlements]]
