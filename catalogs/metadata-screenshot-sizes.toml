# Accepted App Store screenshot sizes for iPhone and iPad, in pixels (width x height).
# `portrait` sizes are accepted as given; `landscape` is the swapped pair unless a display lists its own.
# Formats: .jpeg, .jpg, .png; 1 to 10 screenshots per set; no alpha channel or transparency.
# A display with `fallback` uses scaled screenshots from that display when its own set is missing.

source = "https://developer.apple.com/help/app-store-connect/reference/app-information/screenshot-specifications"
verified = 2026-10-01
min_per_set = 1
max_per_set = 10
formats = ["jpeg", "jpg", "png"]
alpha_allowed = false

