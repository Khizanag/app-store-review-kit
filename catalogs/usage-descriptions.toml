# Protected resources, the APIs that request them, and the Info.plist purpose string each needs.
# Source: https://developer.apple.com/documentation/bundleresources/information-property-list

source = "https://developer.apple.com/documentation/bundleresources/information-property-list"
verified = 2026-10-01

[[resources]]
name = "Camera"
keys = ["NSCameraUsageDescription"]
symbols = ["AVCaptureDevice", "AVCaptureSession", "UIImagePickerController.SourceType.camera", "DataScannerViewController"]

[[resources]]
name = "Microphone"
keys = ["NSMicrophoneUsageDescription"]
symbols = ["AVAudioRecorder", "AVAudioApplication.requestRecordPermission", "recordPermission", "inputNode"]

[[resources]]
name = "Photo library"
keys = ["NSPhotoLibraryUsageDescription", "NSPhotoLibraryAddUsageDescription"]
symbols = ["PHPhotoLibrary.requestAuthorization", "PHAsset.fetchAssets", "UIImageWriteToSavedPhotosAlbum", "PHAssetChangeRequest"]
note = "PhotosPicker and PHPickerViewController need no purpose string; prefer them."

[[resources]]
name = "Location"
