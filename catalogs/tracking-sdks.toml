# Third-party SDKs that collect data off-device, with the signals that reveal them in source,
# package manifests, lockfiles, or linked frameworks. Signals are module, class, or package names,
# never bare words.
#
# kind:
#   advertising      serves ads; usually tracks and needs App Tracking Transparency
#   attribution      measures ad campaigns across apps; usually tracks
#   analytics        product analytics; collects usage data, tracks only if the vendor shares it for ads
#   crash-reporting  collects crash and performance diagnostics
#   engagement       push, messaging, and marketing automation; collects identifiers and contact info
#
# Tracking is defined in https://developer.apple.com/app-store/user-privacy-and-data-use/.
# Initial list adapted from RevylAI/greenlight (MIT), internal/privacy/scanner.go.

verified = 2026-10-01

[[sdks]]
